<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Contact Us - Old Bay Newfoundlands</title>
    <link rel="stylesheet" href="assets/styles/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/styles/fontawesome.min.css" />
    <link rel="stylesheet" href="assets/styles/style.css" />
    <link rel="stylesheet" href="assets/styles/responsive.css" />
    <link rel="stylesheet" href="assets/styles/carousel.css" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <script>
        // Auto-detect: empty string for local dev, GitHub Pages path for production
        window.ASSET_PREFIX = (window.location.hostname === "localhost" ||
                               window.location.hostname === "127.0.0.1")
                               ? "" : "/oldbaynewfoundlands";
    </script>
</head>
<body>

    <div id="navbar-container"></div>
    <div id="breadcrumb-container"></div>

    <section class="contact-area ptb-60">
        <div class="container">
            <div class="section-title">
                <h2>Contact Old Bay Newfoundlands</h2>
            </div>
            <div class="row">
                <div class="col-lg-5 col-md-12">
                    <div class="contact-info">
                        <h3>Here to Help</h3>
                        <p>Have a question about Newfoundlands? Feel free to contact us.</p>
                        <ul class="contact-list">
                            <li><i class="fas fa-map-marker-alt"></i> Location: Oak Island, NC - USA</li>
                            <li><i class="far fa-envelope"></i> Email Us: <a href="mailto:cf@docwizard.com">cf@docwizard.com</a></li>
                        </ul>
                    </div>
                </div>
                <div class="col-lg-7 col-md-12">
                    <div class="contact-form">
                        <h3>Drop Us A Line</h3>
                        <p>We're happy to answer any questions you have. Just send us a message in the form below.</p>

                        <!-- Formspree handles submission - no JS needed -->
                        <form id="contactForm" action="https://formspree.io/xbjgqbzz" method="POST">
                            <div class="row">
                                <div class="col-lg-12 col-md-12">
                                    <div class="form-group">
                                        <label>Name <span>(required)*</span></label>
                                        <input type="text" name="name" class="form-control" required placeholder="Enter your name" />
                                    </div>
                                </div>
                                <div class="col-lg-12 col-md-12">
                                    <div class="form-group">
                                        <label>Email <span>(required)*</span></label>
                                        <input type="email" name="email" class="form-control" required placeholder="Enter your Email Address" />
                                    </div>
                                </div>
                                <div class="col-lg-12 col-md-12">
                                    <div class="form-group">
                                        <label>Phone Number <span>(required)*</span></label>
                                        <input type="text" name="phone_number" class="form-control" required placeholder="Enter your Phone Number" />
                                    </div>
                                </div>
                                <div class="col-lg-12 col-md-12">
                                    <div class="form-group">
                                        <label>Your Message <span>(required)*</span></label>
                                        <textarea name="message" rows="8" required class="form-control" placeholder="Enter your Message"></textarea>
                                    </div>
                                </div>
                                <div class="col-lg-12 col-md-12">
                                    <button type="submit" class="btn btn-primary">Send Message</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>
    <div id="modal-container"></div>

    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script>initPage('Contact Us');</script>
</body>
</html>
